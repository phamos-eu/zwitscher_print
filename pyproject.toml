[project]
name = "zwitscher_print"
authors = [
    { name = "phamos GmbH", email = "support@phamos.eu" },
]
description = "Seam-free Angebot PDF: full-page letterhead stamp over frappe's chrome generator."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<5"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.flit.module]
name = "zwitscher_print"
